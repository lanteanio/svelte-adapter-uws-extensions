name: Dependencies
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.1'
      - run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npm run verify:dependencies
      - run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
