name: Integration

# Every backend tier against real servers, on the supported Node floor and on
# the current release line. Each tier runs in its own job, so one backend's
# failure cannot hide another's. Storage tiers start their own Compose stacks;
# the NTP tier uses loopback UDP. Images are pinned in test/integration/.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.tier }} on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        tier: [ntp, redis, postgres, pgbouncer, valkey, cluster, valkey-cluster]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.tier == 'ntp'
        run: npm run verify:ntp
      - if: matrix.tier == 'redis'
        run: npm run verify:redis
      - if: matrix.tier == 'postgres'
        run: npm run verify:postgres
      - if: matrix.tier == 'pgbouncer'
        run: npm run verify:pgbouncer
      - if: matrix.tier == 'valkey'
        run: npm run verify:valkey
      - if: matrix.tier == 'cluster'
        run: npm run verify:cluster
      - if: matrix.tier == 'valkey-cluster'
        run: npm run verify:valkey-cluster
      - name: Record the runtime and server images
        if: always()
        run: |
          {
            echo "### ${{ matrix.tier }} on Node $(node --version)"
            echo
            echo '```'
            # The content digest of every image the tier ran, read from the
            # local image store rather than from the Compose files.
            docker image ls --quiet | sort -u \
              | xargs --no-run-if-empty docker image inspect --format '{{join .RepoDigests " "}}' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
