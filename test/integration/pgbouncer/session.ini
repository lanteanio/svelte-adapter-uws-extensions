[databases]
test = host=postgres port=5432 dbname=test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 100
default_pool_size = 10
pidfile = /tmp/pgbouncer.pid
log_connections = 0
log_disconnections = 0
