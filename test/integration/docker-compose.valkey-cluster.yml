# Valkey Cluster integration test stack: 6 nodes (3 masters + 3 replicas),
# the Valkey analogue of docker-compose.cluster.yml. A distinct bridge subnet
# (172.31.0.0/24) and host-port range (571xx) let a Valkey cluster run beside
# the Redis cluster (172.30.0.0/24, 570xx) without colliding. Static IPs let the
# test client build a natMap translating each node's docker-internal IP back to
# its host port (clients can't follow MOVED to internal bridge IPs otherwise).
#
# Valkey 9.0+ is required to survive the whole mirror suite (the presence
# HEXPIRE activation gate). Override the image via INTEGRATION_VALKEY_IMAGE.

services:
  valkey-node-0:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_HOST_PORT_BASE:-57100}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.10
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey-node-1:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_NODE_1_PORT:-57101}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.11
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey-node-2:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_NODE_2_PORT:-57102}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.12
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey-node-3:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_NODE_3_PORT:-57103}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.13
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey-node-4:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_NODE_4_PORT:-57104}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.14
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  valkey-node-5:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--port", "6379", "--cluster-enabled", "yes",
              "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000",
              "--appendonly", "no", "--save", ""]
    ports:
      - "${INTEGRATION_VALKEY_CLUSTER_NODE_5_PORT:-57105}:6379"
    networks:
      cluster:
        ipv4_address: 172.31.0.15
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  # One-shot cluster create: waits for all 6 nodes healthy, then runs
  # `valkey-cli --cluster create` with --cluster-replicas 1 (3 masters + 3
  # replicas). --cluster-yes skips the interactive confirm.
  cluster-init:
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    depends_on:
      valkey-node-0:
        condition: service_healthy
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
      valkey-node-4:
        condition: service_healthy
      valkey-node-5:
        condition: service_healthy
    networks:
      - cluster
    command:
      - sh
      - -c
      - |
        valkey-cli --cluster create \
          172.31.0.10:6379 \
          172.31.0.11:6379 \
          172.31.0.12:6379 \
          172.31.0.13:6379 \
          172.31.0.14:6379 \
          172.31.0.15:6379 \
          --cluster-replicas 1 \
          --cluster-yes
    restart: "no"

networks:
  cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
