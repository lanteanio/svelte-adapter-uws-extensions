services:
  redis:
    # Redis 7.4+ required for the per-field hash TTL primitive (HEXPIRE family)
    # used by createPresence. Every backend image in test/integration/ is
    # pinned by its multi-platform index digest, so a run is reproducible and
    # an upstream tag push cannot change the server under test; the tag beside
    # the digest names the exact release. Move a pin deliberately, in every
    # compose file at once, and rerun all tiers.
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${INTEGRATION_REDIS_HOST_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "${INTEGRATION_POSTGRES_HOST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
