services:
  valkey:
    # Valkey is the ecosystem's chosen cache backend; this tier re-runs the
    # Redis-backed integration suite against it. Valkey 9.0+ is required to
    # survive the WHOLE suite: createPresence's per-field hash TTL activation
    # probe (the HEXPIRE family) gates on Valkey >= 9.0. Override the image via
    # INTEGRATION_VALKEY_IMAGE (e.g. to pin an exact patch).
    image: ${INTEGRATION_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${INTEGRATION_VALKEY_HOST_PORT:-56381}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
